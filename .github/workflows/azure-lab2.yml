name: Build and deploy laboratory 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore and build
        run: dotnet build --configuration Release
      - name: Prepare SQL migration bundle
        run: |
          dotnet tool install --tool-path .tools dotnet-ef --version 8.0.31
          .tools/dotnet-ef migrations bundle --self-contained --runtime linux-x64 --output migrationsbundle
      - name: Publish
        run: dotnet publish --configuration Release --output publish
      - uses: actions/upload-artifact@v4
        with:
          name: lab2-application
          path: publish
  deploy:
    if: vars.AZURE_WEBAPP_NAME != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lab2-application
          path: publish
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish
