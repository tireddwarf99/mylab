name: Build and deploy laboratory 2

on:
  push:
    branches: [lab2-azure]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore and build
        run: dotnet build --configuration Release
      - name: Prepare SQL migration bundle
        run: |
          dotnet tool install --tool-path .tools dotnet-ef --version 8.0.31
          .tools/dotnet-ef migrations bundle --self-contained --runtime linux-x64 --output migrationsbundle
      - name: Publish
        run: dotnet publish --configuration Release --output publish
      - uses: actions/upload-artifact@v4
        with:
          name: lab2-application
          path: publish
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lab2-application
          path: publish
      - uses: azure/login@v2
        with:
          client-id: b2ac9c41-a87a-4d2b-829e-5d80123705d1
          tenant-id: 1d369052-0075-4330-a42c-45cd79ed73ae
          subscription-id: 2dd752bf-2f39-4595-852f-4a10edfeca56
      - uses: azure/webapps-deploy@v3
        with:
          app-name: cloud-lab2-hyrladzhyu
          package: publish
